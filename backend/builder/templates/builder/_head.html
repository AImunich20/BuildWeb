{% load static %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* apply the saved theme before first paint (no flash) */
(function(){var t='system';try{t=localStorage.getItem('bw-theme')||'system'}catch(e){}
var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
